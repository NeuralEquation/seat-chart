<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>座席表テンプレート</title>
  <style>
    :root {
      --line: #111;
      --paper: #ffffff;
      --text: #111;
      --muted: #666;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Yu Gothic", "Meiryo", system-ui, sans-serif;
      background: #fff;
    }

    main {
      width: min(960px, calc(100% - 24px));
      margin: 20px auto;
      padding: 18px 10px 24px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 0 auto 12px;
      max-width: 820px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .saved {
      min-width: 7em;
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .saved.dirty {
      color: #b45309;
    }

    .front {
      width: 160px;
      margin: 2px auto 8px;
      padding: 4px 0;
      border: 1px solid transparent;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
    }

    .chart {
      display: grid;
      grid-template-columns: auto auto auto;
      justify-content: center;
      align-items: start;
      gap: clamp(34px, 8vw, 86px);
      overflow-x: auto;
      padding: 0 4px 8px;
      -webkit-overflow-scrolling: touch;
    }

    .block {
      display: grid;
      grid-template-columns: repeat(2, 88px);
      grid-template-rows: repeat(7, 31px);
    }

    .seat {
      position: relative;
      width: 88px;
      height: 31px;
      border: 0 solid var(--line);
      background: var(--paper);
    }

    .seat.empty {
      visibility: hidden;
    }

    .seat input {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
      padding: 2px 4px;
      color: var(--text);
      background: transparent;
      font: 700 14px/1.1 "Yu Gothic", "Meiryo", system-ui, sans-serif;
      text-align: center;
      outline: none;
      letter-spacing: 0;
    }

    .seat input.len-5,
    .seat input.len-6 {
      font-size: 13px;
      padding-inline: 2px;
    }

    .seat input:focus {
      box-shadow: inset 0 0 0 2px var(--accent);
      background: #eff6ff;
    }

    .print-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
    }

    .history {
      max-width: 820px;
      margin: 28px auto 0;
      padding-top: 18px;
      border-top: 1px solid #e5e5e5;
    }

    .history-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 12px;
    }

    .history-heading h2 {
      margin: 0;
      font-size: 16px;
    }

    .history-status {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .history-form {
      display: flex;
      align-items: end;
      gap: 8px;
      margin-bottom: 14px;
    }

    .history-form label {
      display: grid;
      flex: 1;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .history-form input {
      width: 100%;
      min-height: 36px;
      border: 1px solid #c9c9c9;
      border-radius: 6px;
      padding: 6px 9px;
      color: var(--text);
      background: #fff;
      font: 14px/1.2 "Yu Gothic", "Meiryo", system-ui, sans-serif;
    }

    .history-form input:focus {
      border-color: var(--accent);
      outline: 2px solid #dbeafe;
    }

    .history-form button {
      min-height: 36px;
    }

    .history-list {
      display: grid;
      gap: 8px;
    }

    .history-entry {
      border: 1px solid #d9d9d9;
      border-radius: 7px;
      padding: 10px 12px;
      background: #fff;
    }

    .history-entry-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }

    .history-entry-name {
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .history-entry-date {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
    }

    .history-entry-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .history-entry details {
      margin-top: 8px;
      font-size: 13px;
    }

    .history-entry summary {
      cursor: pointer;
      color: #333;
    }

    .diff-list {
      display: grid;
      gap: 4px;
      margin: 8px 0 0;
      padding-left: 20px;
    }

    .diff-added {
      color: #166534;
    }

    .diff-removed {
      color: #b91c1c;
    }

    .diff-changed {
      color: #92400e;
    }

    .history-empty {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    button {
      min-height: 34px;
      border: 1px solid #c9c9c9;
      border-radius: 6px;
      padding: 0 12px;
      background: #fff;
      color: #222;
      font: 700 13px/1 "Yu Gothic", "Meiryo", system-ui, sans-serif;
      cursor: pointer;
    }

    button:hover {
      border-color: #888;
    }

    .preset-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 820px;
      margin: 0 auto 14px;
    }

    .preset-select {
      min-width: 0;
      flex: 1;
      min-height: 42px;
      border: 1px solid #c9d4e2;
      border-radius: 9px;
      padding: 0 10px;
      background: #fff;
      color: var(--text);
      font: 700 14px/1 "Yu Gothic", "Meiryo", system-ui, sans-serif;
    }

    .save-button {
      border-color: #1d4ed8;
      background: #1d4ed8;
      color: #fff;
    }

    .save-button:disabled {
      border-color: #d8e0ea;
      background: #eef2f7;
      color: #94a3b8;
      cursor: default;
    }

    .secondary-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
      max-width: 820px;
      margin: 14px auto 0;
    }

    .secondary-actions button {
      min-height: 38px;
    }

    .status-message {
      min-height: 20px;
      max-width: 820px;
      margin: 0 auto 4px;
      color: var(--muted);
      font-size: 12px;
    }

    dialog {
      width: min(560px, calc(100% - 24px));
      max-height: min(82vh, 720px);
      border: 0;
      border-radius: 14px;
      padding: 0;
      color: var(--text);
      box-shadow: 0 20px 60px rgb(15 23 42 / 25%);
    }

    dialog::backdrop {
      background: rgb(15 23 42 / 45%);
    }

    .dialog-body {
      display: grid;
      gap: 14px;
      padding: 20px;
    }

    .dialog-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .dialog-heading h2 {
      margin: 0;
      font-size: 18px;
    }

    .dialog-close {
      min-height: 34px;
      padding: 0 10px;
      font-size: 20px;
      line-height: 1;
    }

    .preset-list,
    .history-list-modal {
      display: grid;
      gap: 8px;
      max-height: 52vh;
      overflow: auto;
    }

    .preset-item,
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border: 1px solid #d9e2ec;
      border-radius: 9px;
      padding: 10px 12px;
      background: #fff;
    }

    .preset-item.current {
      border-color: #93c5fd;
      background: #eff6ff;
    }

    .preset-item small,
    .history-item small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .dialog-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .danger {
      border-color: #fecaca;
      color: #b91c1c;
    }

    .merge-conflict {
      display: grid;
      gap: 7px;
      border: 1px solid #fed7aa;
      border-radius: 9px;
      padding: 10px;
      background: #fff7ed;
    }

    .merge-conflict-actions {
      display: flex;
      gap: 6px;
    }

    .compare-result {
      max-height: 42vh;
      overflow: auto;
    }

    @media (max-width: 720px) {
      :root {
        --line: #b8c3d1;
        --paper: #fff;
        --text: #172033;
        --muted: #64748b;
        --accent: #1d4ed8;
      }

      body {
        min-height: 100dvh;
        background: #f4f7fb;
      }

      main {
        width: 100%;
        margin: 0;
        padding: 8px 10px 88px;
      }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 2;
        margin: 0 -10px 12px;
        padding: 12px 14px;
        background: rgb(255 255 255 / 96%);
        border-bottom: 1px solid #dbe3ee;
        backdrop-filter: blur(10px);
      }

      h1 {
        font-size: 17px;
      }

      .saved {
        min-width: auto;
        padding: 4px 8px;
        border-radius: 999px;
        background: #e8f7ee;
        color: #247144;
        font-size: 11px;
        font-weight: 700;
      }

      .front {
        width: min(220px, 72%);
        margin: 0 auto 12px;
        padding: 7px 0;
        border: 0;
        border-radius: 999px;
        background: #dbeafe;
        color: #1e40af;
        font-size: 12px;
        font-weight: 700;
      }

      .chart {
        grid-template-columns: repeat(3, auto);
        justify-content: center;
        justify-items: center;
        gap: 10px;
        overflow-x: auto;
        padding: 10px 8px 14px;
        border: 1px solid #dbe3ee;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 3px 12px rgb(30 64 175 / 6%);
        -webkit-overflow-scrolling: touch;
      }

      .block {
        grid-template-columns: repeat(2, clamp(50px, calc((100vw - 56px) / 6), 58px));
        grid-template-rows: repeat(7, 42px);
      }

      .seat {
        width: clamp(50px, calc((100vw - 56px) / 6), 58px);
        height: 42px;
      }

      .seat input {
        min-height: 42px;
        padding: 2px 1px;
        font-size: 12px;
        line-height: 1.15;
      }

      .seat input.len-5,
      .seat input.len-6 {
        padding-inline: 0;
        font-size: 10px;
      }

      .print-row {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 3;
        margin: 0;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        background: rgb(255 255 255 / 96%);
        border-top: 1px solid #dbe3ee;
        box-shadow: 0 -4px 14px rgb(15 23 42 / 8%);
        backdrop-filter: blur(10px);
      }

      .history {
        display: none;
      }

      .preset-controls {
        margin-bottom: 10px;
      }

      .preset-select {
        min-height: 44px;
        font-size: 15px;
      }

      .preset-controls button {
        min-height: 44px;
        padding-inline: 13px;
      }

      .secondary-actions {
        margin-top: 10px;
      }

      .secondary-actions button {
        min-height: 42px;
        font-size: 14px;
      }

      .dialog-body {
        padding: 16px;
      }

      .history-form {
        align-items: stretch;
        flex-direction: column;
      }

      .history-form button {
        width: 100%;
        border-color: #1d4ed8;
        background: #1d4ed8;
        color: #fff;
      }

      .history-entry-head {
        align-items: flex-start;
        flex-direction: column;
        gap: 2px;
      }

      button {
        flex: 1;
        min-height: 44px;
        font-size: 15px;
      }

      .print-row button:first-child {
        border-color: #fecaca;
        color: #b91c1c;
      }

      .print-row button:last-child {
        border-color: #bfdbfe;
        background: #eff6ff;
        color: #1d4ed8;
      }
    }

    @media print {
      body {
        background: #fff;
      }

      main {
        width: 100%;
        margin: 0;
        padding: 10mm 4mm;
      }

      .toolbar,
      .print-row,
      .history,
      .preset-controls,
      .secondary-actions,
      .status-message,
      dialog {
        display: none;
      }

      .chart {
        overflow: visible;
        gap: 26mm;
      }

      .seat input:focus {
        box-shadow: none;
        background: transparent;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="toolbar">
      <h1>座席表</h1>
      <div class="saved" id="savedStatus">保存済み</div>
    </div>

    <div class="preset-controls" aria-label="プリセット操作">
      <select class="preset-select" id="presetSelect" aria-label="現在のプリセット"></select>
      <button type="button" id="saveButton" class="save-button" disabled>変更を保存</button>
      <button type="button" id="menuButton" aria-label="その他の操作">⋯</button>
    </div>
    <div class="status-message" id="statusMessage" aria-live="polite"></div>

    <div class="front">教卓</div>
    <div class="chart" id="chart" aria-label="座席表"></div>

    <div class="secondary-actions">
      <button type="button" id="presetButton">プリセット</button>
      <button type="button" id="historyButton">履歴</button>
      <button type="button" id="printButton">印刷</button>
    </div>

    <div class="print-row">
      <button type="button" id="presetButtonBottom">プリセット</button>
      <button type="button" id="saveButtonBottom" class="save-button" disabled>保存</button>
      <button type="button" id="historyButtonBottom">履歴</button>
    </div>

    <dialog id="presetDialog" aria-labelledby="presetDialogTitle">
      <div class="dialog-body">
        <div class="dialog-heading"><h2 id="presetDialogTitle">プリセット</h2><button type="button" class="dialog-close" data-close="presetDialog" aria-label="閉じる">×</button></div>
        <div class="preset-list" id="presetList"></div>
        <div class="dialog-actions"><button type="button" id="newPresetButton" class="save-button">＋ 新しいプリセット</button><button type="button" id="compareButton">比較</button><button type="button" id="mergeButton">プリセットを統合</button></div>
      </div>
    </dialog>

    <dialog id="historyDialog" aria-labelledby="historyDialogTitle">
      <div class="dialog-body">
        <div class="dialog-heading"><h2 id="historyDialogTitle">変更履歴</h2><button type="button" class="dialog-close" data-close="historyDialog" aria-label="閉じる">×</button></div>
        <div class="history-list-modal" id="historyList"></div>
      </div>
    </dialog>

    <dialog id="menuDialog" aria-labelledby="menuDialogTitle">
      <div class="dialog-body">
        <div class="dialog-heading"><h2 id="menuDialogTitle">その他の操作</h2><button type="button" class="dialog-close" data-close="menuDialog" aria-label="閉じる">×</button></div>
        <div class="dialog-actions"><button type="button" id="renameButton">名前を変更</button><button type="button" id="duplicateButton">複製</button><button type="button" id="clearButton" class="danger">座席をすべて空欄にする</button><button type="button" id="deleteButton" class="danger">プリセットを削除</button></div>
      </div>
    </dialog>

    <dialog id="nameDialog" aria-labelledby="nameDialogTitle">
      <form method="dialog" class="dialog-body" id="nameForm">
        <div class="dialog-heading"><h2 id="nameDialogTitle">プリセット名</h2><button type="button" class="dialog-close" data-close="nameDialog" aria-label="閉じる">×</button></div>
        <label>名前<input id="nameInput" type="text" maxlength="40" required></label>
        <div class="dialog-actions"><button type="button" data-close="nameDialog">キャンセル</button><button type="submit" class="save-button">保存</button></div>
      </form>
    </dialog>

    <dialog id="switchDialog" aria-labelledby="switchDialogTitle">
      <div class="dialog-body"><div class="dialog-heading"><h2 id="switchDialogTitle">未保存の変更があります</h2></div><p>切り替える前に、現在の変更をどうしますか？</p><div class="dialog-actions"><button type="button" id="switchSaveButton" class="save-button">保存して切替</button><button type="button" id="switchDiscardButton" class="danger">破棄して切替</button><button type="button" id="switchCancelButton">キャンセル</button></div></div>
    </dialog>

    <dialog id="compareDialog" aria-labelledby="compareDialogTitle">
      <div class="dialog-body"><div class="dialog-heading"><h2 id="compareDialogTitle">プリセットを比較</h2><button type="button" class="dialog-close" data-close="compareDialog" aria-label="閉じる">×</button></div><div class="dialog-actions"><select id="compareA" aria-label="比較元"></select><span>vs</span><select id="compareB" aria-label="比較先"></select></div><div id="compareResult" class="compare-result"></div></div>
    </dialog>

    <dialog id="mergeDialog" aria-labelledby="mergeDialogTitle">
      <div class="dialog-body"><div class="dialog-heading"><h2 id="mergeDialogTitle">プリセットを統合</h2><button type="button" class="dialog-close" data-close="mergeDialog" aria-label="閉じる">×</button></div><div class="dialog-actions"><select id="mergeA" aria-label="統合元A"></select><select id="mergeB" aria-label="統合元B"></select></div><div id="mergeConflicts"></div><button type="button" id="mergeSaveButton" class="save-button">統合して新規プリセットとして保存</button></div>
    </dialog>
  </main>

  <script type="text/plain" data-legacy-script>
    const STORAGE_KEY = "simpleSeatChart.v1";
    const HISTORY_KEY = "simpleSeatChart.history.v1";
    const chart = document.getElementById("chart");
    const savedStatus = document.getElementById("savedStatus");
    const historyStatus = document.getElementById("historyStatus");
    const historyList = document.getElementById("historyList");
    const versionName = document.getElementById("versionName");
    const recordButton = document.getElementById("recordButton");
    const printButton = document.getElementById("printButton");
    const clearButton = document.getElementById("clearButton");

    const layout = {
      left: [
        [false, true],
        [true, true],
        [true, true],
        [true, true],
        [true, true],
        [true, true],
        [false, true],
      ],
      center: [
        [true, true],
        [true, true],
        [true, true],
        [true, true],
        [true, true],
        [true, true],
        [true, true],
      ],
      right: [
        [true, false],
        [true, true],
        [true, true],
        [true, true],
        [true, true],
        [true, true],
        [true, false],
      ],
    };

    const savedData = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    let history = loadHistory();

    function loadHistory() {
      try {
        const parsed = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
        if (!Array.isArray(parsed)) return [];
        return parsed.filter((entry) => entry && typeof entry === "object" && entry.data && typeof entry.data === "object");
      } catch (error) {
        return [];
      }
    }

    function updateLengthClass(input) {
      input.classList.remove("len-5", "len-6");
      if (input.value.length >= 5) {
        input.classList.add(input.value.length >= 6 ? "len-6" : "len-5");
      }
    }

    function save() {
      const data = {};
      document.querySelectorAll("[data-seat-id]").forEach((input) => {
        data[input.dataset.seatId] = input.value;
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      savedStatus.textContent = "保存済み";
    }

    function getCurrentData() {
      const data = {};
      document.querySelectorAll("[data-seat-id]").forEach((input) => {
        data[input.dataset.seatId] = input.value;
      });
      return data;
    }

    function getSeatLabel(seatId) {
      const [block, row, column] = seatId.split("-");
      const blockLabels = { left: "左", center: "中央", right: "右" };
      return `${blockLabels[block] || block} ${row}行${column}列`;
    }

    function getDiff(previousData, currentData) {
      return Object.keys(currentData)
        .filter((seatId) => (previousData[seatId] || "") !== (currentData[seatId] || ""))
        .map((seatId) => {
          const before = previousData[seatId] || "";
          const after = currentData[seatId] || "";
          return {
            seatId,
            label: getSeatLabel(seatId),
            before,
            after,
            type: !before ? "added" : !after ? "removed" : "changed",
          };
        });
    }

    function formatDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "日時不明";
      return date.toLocaleString("ja-JP", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function createDiffText(diff) {
      if (diff.type === "added") return `${diff.label}: （空欄） → ${diff.after}`;
      if (diff.type === "removed") return `${diff.label}: ${diff.before} → （空欄）`;
      return `${diff.label}: ${diff.before} → ${diff.after}`;
    }

    function renderHistory() {
      historyList.replaceChildren();
      if (!history.length) {
        const empty = document.createElement("p");
        empty.className = "history-empty";
        empty.textContent = "まだ記録はありません。記録名を入力して「差分を記録」を押してください。";
        historyList.appendChild(empty);
        return;
      }

      history.forEach((entry, index) => {
        const previousData = history[index + 1]?.data || {};
        const diff = getDiff(previousData, entry.data);
        const article = document.createElement("article");
        article.className = "history-entry";

        const head = document.createElement("div");
        head.className = "history-entry-head";
        const name = document.createElement("div");
        name.className = "history-entry-name";
        name.textContent = entry.name || "名称なし";
        const date = document.createElement("time");
        date.className = "history-entry-date";
        date.dateTime = entry.createdAt || "";
        date.textContent = formatDate(entry.createdAt);
        head.append(name, date);
        article.appendChild(head);

        const meta = document.createElement("div");
        meta.className = "history-entry-meta";
        meta.textContent = index === history.length - 1
          ? `初回記録・変更 ${diff.length}件`
          : `変更 ${diff.length}件`;
        article.appendChild(meta);

        const details = document.createElement("details");
        const summary = document.createElement("summary");
        summary.textContent = diff.length ? "差分を見る" : "変更なし";
        details.appendChild(summary);
        if (diff.length) {
          const list = document.createElement("ul");
          list.className = "diff-list";
          diff.forEach((item) => {
            const listItem = document.createElement("li");
            listItem.className = `diff-${item.type}`;
            listItem.textContent = createDiffText(item);
            list.appendChild(listItem);
          });
          details.appendChild(list);
        }
        article.appendChild(details);
        historyList.appendChild(article);
      });
    }

    function focusNextSeat(currentInput) {
      const inputs = Array.from(document.querySelectorAll("[data-seat-id]"));
      const nextInput = inputs[inputs.indexOf(currentInput) + 1];
      if (nextInput) {
        nextInput.focus();
        nextInput.select();
      } else {
        currentInput.blur();
      }
    }

    function hasSeat(rows, rowIndex, colIndex) {
      return Boolean(rows[rowIndex] && rows[rowIndex][colIndex]);
    }

    function applySeatBorders(seat, rows, rowIndex, colIndex) {
      seat.style.borderTopWidth = "1px";
      seat.style.borderLeftWidth = "1px";
      if (!hasSeat(rows, rowIndex, colIndex + 1)) {
        seat.style.borderRightWidth = "1px";
      }
      if (!hasSeat(rows, rowIndex + 1, colIndex)) {
        seat.style.borderBottomWidth = "1px";
      }
    }

    function createSeat(id, active, rows, rowIndex, colIndex) {
      const seat = document.createElement("div");
      seat.className = active ? "seat" : "seat empty";
      if (!active) return seat;
      applySeatBorders(seat, rows, rowIndex, colIndex);

      const input = document.createElement("input");
      input.type = "text";
      input.inputMode = "text";
      input.autocomplete = "off";
      input.maxLength = 6;
      input.dataset.seatId = id;
      input.value = savedData[id] || "";
      input.setAttribute("aria-label", `座席 ${id}`);
      input.addEventListener("input", () => {
        updateLengthClass(input);
        save();
        if (input.value.length >= input.maxLength) {
          focusNextSeat(input);
        }
      });
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          focusNextSeat(input);
        }
      });
      input.addEventListener("focus", () => {
        input.select();
      });
      updateLengthClass(input);
      seat.appendChild(input);
      return seat;
    }

    Object.entries(layout).forEach(([blockName, rows]) => {
      const block = document.createElement("section");
      block.className = "block";
      block.setAttribute("aria-label", `${blockName} ブロック`);
      rows.forEach((row, rowIndex) => {
        row.forEach((active, colIndex) => {
          block.appendChild(createSeat(`${blockName}-${rowIndex + 1}-${colIndex + 1}`, active, rows, rowIndex, colIndex));
        });
      });
      chart.appendChild(block);
    });

    recordButton.addEventListener("click", () => {
      const name = versionName.value.trim();
      if (!name) {
        historyStatus.textContent = "記録名を入力してください";
        versionName.focus();
        return;
      }

      const entry = {
        id: window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`,
        name,
        createdAt: new Date().toISOString(),
        data: getCurrentData(),
      };

      try {
        history.unshift(entry);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        versionName.value = "";
        historyStatus.textContent = `「${name}」を記録しました`;
        renderHistory();
      } catch (error) {
        history.shift();
        historyStatus.textContent = "記録できませんでした";
      }
    });

    renderHistory();
    printButton.addEventListener("click", () => window.print());
    clearButton.addEventListener("click", () => {
      if (!confirm("座席表の名前をすべて消去しますか？")) return;
      document.querySelectorAll("[data-seat-id]").forEach((input) => {
        input.value = "";
        updateLengthClass(input);
      });
      save();
    });
  </script>

  <script>
    const APP_KEY = "simpleSeatChart.v2";
    const OLD_KEY = "simpleSeatChart.v1";
    const OLD_HISTORY_KEY = "simpleSeatChart.history.v1";
    const chart = document.getElementById("chart");
    const savedStatus = document.getElementById("savedStatus");
    const statusMessage = document.getElementById("statusMessage");
    const presetSelect = document.getElementById("presetSelect");
    const saveButton = document.getElementById("saveButton");
    const saveButtonBottom = document.getElementById("saveButtonBottom");
    const presetList = document.getElementById("presetList");
    const historyList = document.getElementById("historyList");
    const layout = {
      left: [[false,true],[true,true],[true,true],[true,true],[true,true],[true,true],[false,true]],
      center: [[true,true],[true,true],[true,true],[true,true],[true,true],[true,true],[true,true]],
      right: [[true,false],[true,true],[true,true],[true,true],[true,true],[true,true],[true,false]]
    };

    const clone = (value) => JSON.parse(JSON.stringify(value));
    const newId = () => window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    function readJson(key, fallback) {
      try { const value = JSON.parse(localStorage.getItem(key) || ""); return value ?? fallback; } catch { return fallback; }
    }
    function blankData() {
      const data = {};
      Object.entries(layout).forEach(([block, rows]) => rows.forEach((row, r) => row.forEach((active, c) => { if (active) data[`${block}-${r + 1}-${c + 1}`] = ""; })));
      return data;
    }
    function cleanData(data) { const result = blankData(); if (data && typeof data === "object") Object.keys(result).forEach((id) => { if (Object.prototype.hasOwnProperty.call(data, id)) result[id] = String(data[id] ?? "").slice(0, 6); }); return result; }
    function diffData(before, after) {
      return Object.keys(cleanData(after)).filter((id) => (before?.[id] || "") !== (after?.[id] || "")).map((seatId) => {
        const [block, row, column] = seatId.split("-");
        const labels = { left: "左", center: "中央", right: "右" };
        const beforeValue = before?.[seatId] || "";
        const afterValue = after?.[seatId] || "";
        return { seatId, label: `${labels[block] || block} ${row}行${column}列`, before: beforeValue, after: afterValue, type: !beforeValue ? "added" : !afterValue ? "removed" : "changed" };
      });
    }
    function makePreset(name, data) {
      const now = new Date().toISOString();
      return { id: newId(), name: name || "通常席", createdAt: now, updatedAt: now, data: cleanData(data), history: [] };
    }
    function migrate() {
      const oldData = cleanData(readJson(OLD_KEY, {}));
      const preset = makePreset("通常席", oldData);
      const oldHistory = readJson(OLD_HISTORY_KEY, []);
      if (Array.isArray(oldHistory)) oldHistory.filter((e) => e && e.data && typeof e.data === "object").forEach((entry, index, list) => {
        preset.history.push({ id: entry.id || newId(), createdAt: entry.createdAt || new Date().toISOString(), data: cleanData(entry.data), previousData: cleanData(list[index + 1]?.data || {}), changeCount: diffData(list[index + 1]?.data || {}, entry.data).length });
      });
      return { version: 2, activePresetId: preset.id, workingData: oldData, presets: [preset] };
    }
    function loadState() {
      const stored = readJson(APP_KEY, null);
      if (!stored || stored.version !== 2 || !Array.isArray(stored.presets) || !stored.presets.length) return migrate();
      stored.presets = stored.presets.filter((p) => p && p.id).map((p) => ({ ...makePreset(p.name, p.data), ...p, data: cleanData(p.data), history: Array.isArray(p.history) ? p.history : [] }));
      if (!stored.presets.some((p) => p.id === stored.activePresetId)) stored.activePresetId = stored.presets[0].id;
      stored.workingData = cleanData(stored.workingData || stored.presets[0].data);
      return stored;
    }
    let state = loadState();
    if (!readJson(APP_KEY, null)) { try { localStorage.setItem(APP_KEY, JSON.stringify(state)); } catch {} }
    let pendingSwitch = null;
    let nameDialogMode = null;
    let mergeData = {};
    let mergeConflicts = {};
    let mergeResolved = {};

    function persist() {
      try {
        localStorage.setItem(APP_KEY, JSON.stringify(state));
        localStorage.setItem(OLD_KEY, JSON.stringify(state.workingData));
      } catch {
        setStatus("保存領域に書き込めませんでした。ブラウザの設定を確認してください。");
      }
    }
    function activePreset() { return state.presets.find((p) => p.id === state.activePresetId) || state.presets[0]; }
    function isDirty() { return JSON.stringify(cleanData(activePreset().data)) !== JSON.stringify(cleanData(state.workingData)); }
    function setStatus(message) { statusMessage.textContent = message || ""; }
    function updateStatus() {
      const dirty = isDirty();
      savedStatus.textContent = dirty ? "未保存の変更あり" : "保存済み ✓";
      savedStatus.classList.toggle("dirty", dirty);
      saveButton.disabled = !dirty;
      saveButtonBottom.disabled = !dirty;
    }
    function syncInputs() {
      document.querySelectorAll("[data-seat-id]").forEach((input) => { input.value = state.workingData[input.dataset.seatId] || ""; updateLengthClass(input); });
    }
    function formatDate(value) { const date = new Date(value); return Number.isNaN(date.getTime()) ? "日時不明" : date.toLocaleString("ja-JP", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }); }
    function updateLengthClass(input) { input.classList.remove("len-5", "len-6"); if (input.value.length >= 5) input.classList.add(input.value.length >= 6 ? "len-6" : "len-5"); }
    function seatLabel(id) { const [block, row, column] = id.split("-"); return `${({ left: "左", center: "中央", right: "右" })[block] || block} ${row}行${column}列`; }
    function focusNextSeat(current) { const inputs = [...document.querySelectorAll("[data-seat-id]")]; const next = inputs[inputs.indexOf(current) + 1]; if (next) { next.focus(); next.select(); } }
    function hasSeat(rows, r, c) { return Boolean(rows[r] && rows[r][c]); }
    function createSeat(id, active, rows, r, c) {
      const seat = document.createElement("div"); seat.className = active ? "seat" : "seat empty"; if (!active) return seat;
      seat.style.borderTopWidth = "1px"; seat.style.borderLeftWidth = "1px"; if (!hasSeat(rows, r, c + 1)) seat.style.borderRightWidth = "1px"; if (!hasSeat(rows, r + 1, c)) seat.style.borderBottomWidth = "1px";
      const input = document.createElement("input"); input.type = "text"; input.inputMode = "text"; input.autocomplete = "off"; input.maxLength = 6; input.dataset.seatId = id; input.value = state.workingData[id] || ""; input.setAttribute("aria-label", `座席 ${seatLabel(id)}`);
      input.addEventListener("input", () => { state.workingData[id] = input.value; updateLengthClass(input); persist(); updateStatus(); });
      input.addEventListener("keydown", (event) => { if (event.key === "Enter") { event.preventDefault(); focusNextSeat(input); } }); input.addEventListener("focus", () => input.select()); updateLengthClass(input); seat.appendChild(input); return seat;
    }
    Object.entries(layout).forEach(([block, rows]) => { const section = document.createElement("section"); section.className = "block"; section.setAttribute("aria-label", `${block} ブロック`); rows.forEach((row, r) => row.forEach((active, c) => section.appendChild(createSeat(`${block}-${r + 1}-${c + 1}`, active, rows, r, c)))); chart.appendChild(section); });

    function renderPresetSelects() {
      const selects = [presetSelect, document.getElementById("compareA"), document.getElementById("compareB"), document.getElementById("mergeA"), document.getElementById("mergeB")];
      selects.forEach((select) => { const current = select.value; select.replaceChildren(); state.presets.forEach((p) => { const option = new Option(p.name, p.id); select.appendChild(option); }); if ([...select.options].some((o) => o.value === current)) select.value = current; });
      presetSelect.value = state.activePresetId;
    }
    function renderPresetList() {
      presetList.replaceChildren(); state.presets.forEach((p) => { const item = document.createElement("div"); item.className = `preset-item${p.id === state.activePresetId ? " current" : ""}`; const info = document.createElement("div"); const title = document.createElement("strong"); title.textContent = p.name; const meta = document.createElement("small"); meta.textContent = `更新 ${formatDate(p.updatedAt)}`; info.append(title, meta); const open = document.createElement("button"); open.textContent = p.id === state.activePresetId ? "選択中" : "開く"; open.disabled = p.id === state.activePresetId; open.addEventListener("click", () => requestSwitch(p.id)); item.append(info, open); presetList.appendChild(item); });
    }
    function renderHistory() {
      const history = activePreset().history || []; historyList.replaceChildren(); if (!history.length) { const empty = document.createElement("p"); empty.className = "history-empty"; empty.textContent = "保存すると、ここに自動で履歴が残ります。"; historyList.appendChild(empty); return; }
      history.forEach((entry, index) => { const item = document.createElement("article"); item.className = "history-item"; const info = document.createElement("div"); const title = document.createElement("strong"); title.textContent = formatDate(entry.createdAt); const meta = document.createElement("small"); meta.textContent = `変更 ${entry.changeCount ?? 0}席`; info.append(title, meta); const actions = document.createElement("div"); const details = document.createElement("details"); const summary = document.createElement("summary"); summary.textContent = "差分"; const list = document.createElement("ul"); list.className = "diff-list"; diffData(entry.previousData || history[index + 1]?.data || {}, entry.data).forEach((d) => { const li = document.createElement("li"); li.className = `diff-${d.type}`; li.textContent = `${d.label}: ${d.before || "（空欄）"} → ${d.after || "（空欄）"}`; list.appendChild(li); }); details.append(summary, list); const restore = document.createElement("button"); restore.textContent = "この状態に復元"; restore.addEventListener("click", () => { state.workingData = cleanData(entry.data); syncInputs(); persist(); updateStatus(); closeDialog("historyDialog"); setStatus("履歴の状態を編集中に復元しました。保存すると新しい履歴になります。"); }); actions.append(details, restore); item.append(info, actions); historyList.appendChild(item); });
    }
    function openDialog(id) { document.getElementById(id).showModal(); }
    function closeDialog(id) { document.getElementById(id).close(); }
    function savePreset() { const preset = activePreset(); const changes = diffData(preset.data, state.workingData); if (!changes.length) return; const now = new Date().toISOString(); preset.history.unshift({ id: newId(), createdAt: now, data: clone(state.workingData), previousData: clone(preset.data), changeCount: changes.length }); preset.data = clone(state.workingData); preset.updatedAt = now; persist(); updateStatus(); renderPresetList(); renderHistory(); setStatus(`「${preset.name}」を保存しました（${changes.length}席変更）`); }
    function switchPreset(id) { state.activePresetId = id; state.workingData = clone(activePreset().data); syncInputs(); persist(); presetSelect.value = id; updateStatus(); renderPresetList(); renderHistory(); setStatus(`「${activePreset().name}」を開きました`); }
    function requestSwitch(id) { if (id === state.activePresetId) return; pendingSwitch = id; if (isDirty()) openDialog("switchDialog"); else switchPreset(id); }
    function openNameDialog(title, initial, callback) { document.getElementById("nameDialogTitle").textContent = title; document.getElementById("nameInput").value = initial || ""; nameDialogMode = callback; openDialog("nameDialog"); setTimeout(() => document.getElementById("nameInput").focus(), 0); }
    function renderCompare() { const a = state.presets.find((p) => p.id === document.getElementById("compareA").value); const b = state.presets.find((p) => p.id === document.getElementById("compareB").value); const result = document.getElementById("compareResult"); result.replaceChildren(); if (!a || !b) return; const changes = diffData(a.data, b.data); const heading = document.createElement("p"); heading.textContent = `${a.name} → ${b.name}: 変更 ${changes.length}席`; result.appendChild(heading); const list = document.createElement("ul"); list.className = "diff-list"; changes.forEach((d) => { const li = document.createElement("li"); li.textContent = `${d.label}: ${d.before || "（空欄）"} → ${d.after || "（空欄）"}`; list.appendChild(li); }); result.appendChild(list); }
    function renderMerge() { const a = state.presets.find((p) => p.id === document.getElementById("mergeA").value); const b = state.presets.find((p) => p.id === document.getElementById("mergeB").value); const holder = document.getElementById("mergeConflicts"); const save = document.getElementById("mergeSaveButton"); holder.replaceChildren(); mergeConflicts = {}; mergeResolved = {}; mergeData = {}; save.disabled = true; if (!a || !b || a.id === b.id) return; Object.keys(blankData()).forEach((id) => { const av = a.data[id] || "", bv = b.data[id] || ""; if (av && bv && av !== bv) { mergeConflicts[id] = { a: av, b: bv }; const box = document.createElement("div"); box.className = "merge-conflict"; const text = document.createElement("div"); text.textContent = `${seatLabel(id)}: ${a.name}「${av}」 / ${b.name}「${bv}」`; const actions = document.createElement("div"); actions.className = "merge-conflict-actions"; [av, bv].forEach((value, i) => { const button = document.createElement("button"); button.textContent = `${i ? b.name : a.name}を採用`; button.addEventListener("click", () => { mergeData[id] = value; mergeResolved[id] = true; actions.querySelectorAll("button").forEach((x) => x.classList.remove("save-button")); button.classList.add("save-button"); save.disabled = Object.keys(mergeConflicts).some((key) => !mergeResolved[key]); }); actions.appendChild(button); }); box.append(text, actions); holder.appendChild(box); } else mergeData[id] = av || bv; }); save.disabled = Object.keys(mergeConflicts).length > 0; }
    presetSelect.addEventListener("change", () => requestSwitch(presetSelect.value));
    [saveButton, saveButtonBottom].forEach((button) => button.addEventListener("click", savePreset));
    document.getElementById("presetButton").addEventListener("click", () => { renderPresetList(); openDialog("presetDialog"); });
    document.getElementById("presetButtonBottom").addEventListener("click", () => { renderPresetList(); openDialog("presetDialog"); });
    document.getElementById("historyButton").addEventListener("click", () => { renderHistory(); openDialog("historyDialog"); });
    document.getElementById("historyButtonBottom").addEventListener("click", () => { renderHistory(); openDialog("historyDialog"); });
    document.getElementById("printButton").addEventListener("click", () => window.print());
    document.getElementById("menuButton").addEventListener("click", () => openDialog("menuDialog"));
    document.querySelectorAll("[data-close]").forEach((button) => button.addEventListener("click", () => closeDialog(button.dataset.close)));
    document.getElementById("newPresetButton").addEventListener("click", () => openNameDialog("新しいプリセット", "", (name) => { const preset = makePreset(name, state.workingData); state.presets.unshift(preset); state.activePresetId = preset.id; state.workingData = clone(preset.data); persist(); renderPresetSelects(); renderPresetList(); updateStatus(); closeDialog("nameDialog"); closeDialog("presetDialog"); setStatus(`「${preset.name}」を作成しました`); }));
    document.getElementById("nameForm").addEventListener("submit", (event) => { event.preventDefault(); const name = document.getElementById("nameInput").value.trim(); if (!name || !nameDialogMode) return; const callback = nameDialogMode; nameDialogMode = null; callback(name); });
    document.getElementById("renameButton").addEventListener("click", () => { const preset = activePreset(); closeDialog("menuDialog"); openNameDialog("プリセット名を変更", preset.name, (name) => { preset.name = name; preset.updatedAt = new Date().toISOString(); persist(); renderPresetSelects(); renderPresetList(); closeDialog("nameDialog"); setStatus("プリセット名を変更しました"); }); });
    document.getElementById("duplicateButton").addEventListener("click", () => { const source = activePreset(); const preset = makePreset(`${source.name}のコピー`, source.data); state.presets.unshift(preset); state.activePresetId = preset.id; state.workingData = clone(preset.data); persist(); renderPresetSelects(); renderPresetList(); updateStatus(); closeDialog("menuDialog"); setStatus(`「${preset.name}」を作成しました`); });
    document.getElementById("deleteButton").addEventListener("click", () => { if (state.presets.length < 2) { setStatus("最後のプリセットは削除できません"); return; } if (isDirty() && !window.confirm("未保存の変更があります。削除すると現在の変更も失われます。続行しますか？")) return; if (!window.confirm(`「${activePreset().name}」を削除しますか？この操作は元に戻せません。`)) return; const removed = state.activePresetId; state.presets = state.presets.filter((p) => p.id !== removed); state.activePresetId = state.presets[0].id; state.workingData = clone(activePreset().data); persist(); renderPresetSelects(); renderPresetList(); updateStatus(); closeDialog("menuDialog"); setStatus("プリセットを削除しました"); });
    document.getElementById("clearButton").addEventListener("click", () => { if (!window.confirm("このプリセットの座席をすべて空欄にしますか？変更は保存するまで確定しません。")) return; state.workingData = blankData(); [...document.querySelectorAll("[data-seat-id]")].forEach((input) => { input.value = ""; updateLengthClass(input); }); persist(); updateStatus(); closeDialog("menuDialog"); setStatus("座席をすべて空欄にしました。保存すると確定します。"); });
    document.getElementById("switchSaveButton").addEventListener("click", () => { savePreset(); const target = pendingSwitch; pendingSwitch = null; closeDialog("switchDialog"); switchPreset(target); });
    document.getElementById("switchDiscardButton").addEventListener("click", () => { const target = pendingSwitch; pendingSwitch = null; closeDialog("switchDialog"); switchPreset(target); });
    document.getElementById("switchCancelButton").addEventListener("click", () => { pendingSwitch = null; presetSelect.value = state.activePresetId; closeDialog("switchDialog"); });
    document.getElementById("compareButton").addEventListener("click", () => { renderCompare(); openDialog("compareDialog"); });
    ["compareA", "compareB"].forEach((id) => document.getElementById(id).addEventListener("change", renderCompare));
    document.getElementById("mergeButton").addEventListener("click", () => { renderMerge(); openDialog("mergeDialog"); });
    ["mergeA", "mergeB"].forEach((id) => document.getElementById(id).addEventListener("change", renderMerge));
    document.getElementById("mergeSaveButton").addEventListener("click", () => { const a = document.getElementById("mergeA").value, b = document.getElementById("mergeB").value; if (!a || !b || a === b) { setStatus("異なる2つのプリセットを選択してください"); return; } const preset = makePreset(`${state.presets.find((p) => p.id === a).name}＋${state.presets.find((p) => p.id === b).name}`, mergeData); state.presets.unshift(preset); state.activePresetId = preset.id; state.workingData = clone(preset.data); persist(); renderPresetSelects(); renderPresetList(); updateStatus(); closeDialog("mergeDialog"); setStatus(`「${preset.name}」を作成しました`); });
    renderPresetSelects(); renderPresetList(); updateStatus();
  </script>
